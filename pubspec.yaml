  persistent_bottom_nav_bar: ^4.0.2
  shared_preferences: ^2.0.13
  font_awesome_flutter: ^10.1.0
  intl: ^0.17.0
  material_design_icons_flutter: ^6.0.7096
  google_sign_in: ^5.4.2
  progress_indicators: ^1.0.0
  device_info_plus: ^8.0.0
