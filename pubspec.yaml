#    git:
#      url: https://github.com/rvndsngwn/form_builder_extra_fields.git
  google_maps_webservice: ^0.0.20-nullsafety.5
  google_maps_flutter_web: ^0.4.0+5
  logger: ^1.1.0
  awesome_dialog: ^3.0.2
  purchases_flutter: ^4.10.2
  url_launcher: ^6.1.10
  showcaseview: ^2.0.1
  firebase_messaging: ^13.1.0
  image_cropper: ^3.0.2
  path_provider: ^2.0.14
  flutter_image_compress: ^1.1.3
  compress_images_flutter: ^0.0.3+4
  firebase_analytics: ^9.3.8
  connectivity_plus: ^3.0.4
  otp_text_field: ^1.1.3
  sms_autofill: ^2.3.0
  timer_count_down: ^2.2.2
  lottie: ^2.0.0
  page_transition: ^2.0.9
  swipeable_button_view: ^0.0.2
  envied: ^0.3.0+3
  device_preview: ^1.1.0
  flutter_paystack: ^1.0.7
  webview_flutter_plus: ^0.3.0+2
  web_socket_channel: ^2.1.0
  video_player: ^2.7.2
  chewie: ^1.0.0
  google_nav_bar: ^5.0.6
  liquid_swipe: ^3.1.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^4.2.1
  awesome_flutter_extensions: ^0.0.1+2
  flutter_launcher_icons: ^0.13.1
  capped_progress_indicator: ^0.0.2
  auto_size_text: ^3.0.0



#dependency_overrides:
#  intl: ^0.18.0



flutter_native_splash:
  color: "#ffffff"
  image: assets/splash/splash.png
  android: true
  ios: true
  android_gravity: fill  # Ensures the image covers the entire screen
  ios_content_mode: scaleToFill  # Ensures the image covers the entire screen on iOS
  android_navigation_color: transparent
  android_navigation_icon_color: black



dev_dependencies:
  flutter_test:
    sdk: flutter
  #flutter_launcher_icons: ^0.10.0


flutter_icons:
  image_path:  "assets/logos/icon.png"
  android: true
  ios: true
  adaptive_icon_foreground: "assets/logos/icon.png"
  adaptive_icon_background: "#000000"


  flutter_lints: ^1.0.0
flutter_launcher_name:
  name: "Izinto"



flutter:

  uses-material-design: true

  assets:
    - assets/image/
    - assets/logos/
    - assets/splash/
    - assets/DB/specialties/
    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900
