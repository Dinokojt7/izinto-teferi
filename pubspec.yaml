name: izinto
description: An ondemand delivery platform

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"


dependencies:
  get: ^4.6.1
  dots_indicator: ^4.0.1
  cupertino_icons: ^1.0.2

  # FIREBASE - Use compatible versions
  firebase_core: 4.2.0
  firebase_analytics: 12.0.3
  cloud_firestore: 6.0.3
  firebase_auth: 6.1.1
  firebase_storage: ^13.0.3
  firebase_messaging: ^16.0.3
  # REMOVE these problematic packages:
  # firebase_image: ^1.1.1
  firebase_core_platform_interface: 6.0.2
  persistent_bottom_nav_bar: ^6.2.1
  shared_preferences: ^2.0.13
  font_awesome_flutter: ^10.1.0
  intl: ^0.20.2
  material_design_icons_flutter: ^7.0.7296
  google_sign_in: ^7.2.0
  progress_indicators: ^1.0.0
  device_info_plus: ^12.1.0
  package_info_plus: ^9.0.0
  flutter_native_splash: ^2.2.18
  simple_circular_progress_bar: ^1.0.2
  pinput: ^5.0.2
  provider: ^6.0.4
  flutter_spinkit: ^5.1.0
  location: ^8.0.1
  geolocator: ^14.0.1
  geocoding: ^4.0.0
  http: ^1.5.0
  google_maps_flutter: ^2.0.6
  flutter_typeahead: ^5.2.0

  # FIXED VERSIONS:
  wakelock_plus: ^1.4.0
  uuid: ^4.5.1
  flutter_statusbarcolor_ns: ^0.6.0
  form_builder_extra_fields: ^12.1.0
  flutter_google_maps_webservices: ^1.1.1
  google_maps_flutter_web: ^0.5.3  # Updated
  logger: ^2.6.2
  awesome_dialog: ^3.0.2
  purchases_flutter: ^9.8.0
  url_launcher: ^6.1.10
  showcaseview: ^5.0.0
  image_cropper: ^11.0.0
  path_provider: ^2.0.14
  flutter_image_compress: ^2.0.0
  compress_images_flutter: ^0.0.3+4
  connectivity_plus: ^7.0.0
  otp_text_field: ^1.1.3
  sms_autofill: ^2.3.0
  timer_count_down: ^2.2.2
  lottie: ^3.3.2
  page_transition: ^2.0.9
  swipeable_button_view: ^0.0.2
  envied: ^1.3.1
  device_preview: ^1.1.0
  pay_with_paystack: ^1.0.7+1
  web_socket_channel: ^3.0.3
  video_player: ^2.7.2
  chewie: ^1.0.0
  google_nav_bar: ^5.0.6
  liquid_swipe: ^3.1.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^5.0.0  # Updated to fix conflict
  awesome_flutter_extensions: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  capped_progress_indicator: ^0.0.2
  auto_size_text: ^3.0.0
  webview_flutter: ^4.4.2


# Remove this override
# dependency_overrides:
#   intl: ^0.18.0



flutter_native_splash:
  color: "#ffffff"
  image: assets/splash/splash.png
  android: true
  ios: true
  android_gravity: fill  # Ensures the image covers the entire screen
  ios_content_mode: scaleToFill  # Ensures the image covers the entire screen on iOS
  android_navigation_color: transparent
  android_navigation_icon_color: black



dev_dependencies:
  flutter_test:
    sdk: flutter
  #flutter_launcher_icons: ^0.10.0


flutter_icons:
  image_path:  "assets/logos/icon.png"
  android: true
  ios: true
  adaptive_icon_foreground: "assets/logos/icon.png"
  adaptive_icon_background: "#000000"


  flutter_lints: ^1.0.0
flutter_launcher_name:
  name: "Izinto"



flutter:

  uses-material-design: true

  assets:
    - assets/image/
    - assets/logos/
    - assets/splash/
    - assets/DB/specialties/
    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900
